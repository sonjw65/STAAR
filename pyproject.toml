[build-system]
requires = ["setuptools>=45", "wheel"]

[project]
name = "staar"
version = "0.1.0"
description = "Official implementation of STAAR: Spatio-Temporal Attention over Adaptive Regions for Traffic Forecasting."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "STAAR Authors"}
]
keywords = [
    "time-series-forecasting",
    "traffic-forecasting",
    "spatio-temporal-attention",
    "adaptive-regions"
]
dependencies = [
    "easy-torch==1.3.3",
    "easydict",
    "packaging",
    "setproctitle",
    "numpy",
    "scipy",
    "tqdm==4.67.1",
    "tensorboard==2.18.0",
    "pymetis"
]

[project.urls]
Homepage = ""
Repository = ""
Framework = "https://github.com/GestaltCogTeam/BasicTS"

[tool.setuptools]
package-dir = {"" = "src"}
